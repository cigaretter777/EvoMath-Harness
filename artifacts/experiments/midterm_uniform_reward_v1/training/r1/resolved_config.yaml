  output_dir: artifacts/experiments/midterm_uniform_reward_v1/training/r1
  reward_path: configs/reward/r1_unified.yaml
  schema_version: adaptive-math-grpo-v1
  task_pool_path: artifacts/task_pools/math_midterm_v1_rl_train.jsonl
  task_pool_sha256: 635f9571b056f395fd574b9fd1e4d6e1eb4b28efbf3d38f38c410aed19396d46
  upstream_config_name: hgpo_trainer
  upstream_overrides:
  - actor_rollout_ref.model.path=/root/autodl-tmp/Adaptive-Solver-main-git/artifacts/models/qwen3_1_7b_sft_tir_merged
  - actor_rollout_ref.model.enable_gradient_checkpointing=True
  - actor_rollout_ref.model.lora_rank=16
  - actor_rollout_ref.model.lora_alpha=32
  - actor_rollout_ref.rollout.n=1
  - actor_rollout_ref.rollout.tensor_model_parallel_size=1
  - actor_rollout_ref.rollout.temperature=1.0
  - actor_rollout_ref.rollout.top_p=0.95
  - actor_rollout_ref.rollout.top_k=20
  - +actor_rollout_ref.rollout.engine_kwargs.vllm.enable_prefix_caching=False
  - actor_rollout_ref.actor.ppo_mini_batch_size=8
  - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
  - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
  - actor_rollout_ref.actor.use_invalid_action_penalty=False
  - env.rollout.n=4
  - env.max_steps=6
  - data.train_files=/root/autodl-tmp/BudgetConstrainedReasoningMathAgent/artifacts/task_pools/math_midterm_v1_rl_schedule_50x8.parquet
  - data.val_files=/root/autodl-tmp/BudgetConstrainedReasoningMathAgent/artifacts/task_pools/math_midterm_v1_rl_schedule_50x8.parquet
  - data.train_batch_size=8
  - data.val_batch_size=8
  - data.return_raw_chat=true
  - data.max_prompt_length=4096
  - data.max_response_length=2048
  - data.shuffle=false
  - +data.seed=20261022
  - trainer.total_training_steps=50
  - trainer.n_gpus_per_node=1
  - trainer.nnodes=1
  - ray_init.num_cpus=8
  - trainer.ray_wait_register_center_timeout=120
  - trainer.logger=["console"]
  - trainer.project_name=adaptive_math_grpo
  - trainer.experiment_name=midterm_unified_r1
  - trainer.default_local_dir=/root/autodl-tmp/BudgetConstrainedReasoningMathAgent/artifacts/experiments/midterm_uniform_reward_v1/training/r1/checkpoints
  - trainer.rollout_data_dir=/root/autodl-tmp/BudgetConstrainedReasoningMathAgent/artifacts/experiments/midterm_uniform_reward_v1/training/r1/rollout_dump
  - trainer.save_freq=10
  - trainer.max_actor_ckpt_to_keep=1
  - trainer.test_freq=-1
  - trainer.val_before_train=false
  - trainer.resume_mode=disable
  - algorithm.adv_estimator=grpo
  - algorithm.use_kl_in_reward=false
  - actor_rollout_ref.actor.use_kl_loss=false
upstream:
  actor_rollout_ref:
    actor:
      checkpoint:
        contents:
        - model
        - optimizer
        - extra
      clip_ratio: 0.2
      clip_ratio_c: 3.0
      clip_ratio_high: 0.2
      clip_ratio_low: 0.2
      entropy_coeff: 0.001
      fsdp_config:
        fsdp_size: -1
        offload_policy: false
        optimizer_offload: false
        param_offload: false
        reshard_after_forward: true
        wrap_policy:
          min_num_params: 0
      grad_clip: 1.0
      invalid_action_penalty_coef: 0.1
      kl_loss_coef: 0.001
      kl_loss_type: low_var_kl
      loss_agg_mode: token-mean
      optim:
        lr: 1.0e-06
        lr_warmup_steps: -1
        lr_warmup_steps_ratio: 0.0
        min_lr_ratio: 0.0
        num_cycles: 0.5
        total_training_steps: -1
        warmup_style: constant
        weight_decay: 0.01
      policy_loss:
        loss_mode: vanilla
      ppo_epochs: 1
      ppo_max_token_len_per_gpu: 16384
      ppo_micro_batch_size: null
      ppo_micro_batch_size_per_gpu: 1
      ppo_mini_batch_size: 8
      shuffle: false
      strategy: fsdp
      ulysses_sequence_parallel_size: 1
      use_dynamic_bsz: false
      use_invalid_action_penalty: false
      use_kl_loss: false
      use_torch_compile: true
    hybrid_engine: true
    model:
      enable_activation_offload: false
      enable_gradient_checkpointing: true
      external_lib: null
      lora_alpha: 32
      lora_rank: 16
      override_config: {}
      path: /root/autodl-tmp/Adaptive-Solver-main-git/artifacts/models/qwen3_1_7b_sft_tir_merged
      target_modules: all-linear
      trust_remote_code: false
      use_fused_kernels: false
      use_liger: false
      use_remove_padding: false
      use_shm: false
    ref:
      fsdp_config:
        param_offload: false
        reshard_after_forward: true
        wrap_policy:
          min_num_params: 0
      log_prob_max_token_len_per_gpu: 16384
      log_prob_micro_batch_size: null
      log_prob_micro_batch_size_per_gpu: null
      log_prob_use_dynamic_bsz: false
      strategy: fsdp
      ulysses_sequence_parallel_size: 1
      use_torch_compile: true
    rollout:
      chat_scheduler: null
      disable_log_stats: true
      do_sample: true
      dtype: bfloat16
      enable_chunked_prefill: true
      enforce_eager: true
      engine_kwargs:
        sglang:
          attention_backend: null
        vllm:
          enable_prefix_caching: false
          swap_space: null
      free_cache_engine: true
      gpu_memory_utilization: 0.5
      ignore_eos: false
      layered_summon: false
      load_format: dummy_dtensor
      log_prob_max_token_len_per_gpu: 16384
      log_prob_micro_batch_size: null
      log_prob_micro_batch_size_per_gpu: 1
      log_prob_use_dynamic_bsz: false
      max_model_len: null
      max_num_batched_tokens: 8192
      max_num_seqs: 1024
      mode: sync
      multi_turn:
        enable: false
        format: chatml
        max_turns: null
        tool_config_path: null
      n: 1
      name: vllm
      prompt_length: 4096
      response_length: 2048
      temperature: 1.0
      tensor_model_parallel_size: 1
      top_k: 20
      top_p: 0.95
      use_fire_sampling: false
      val_kwargs:
        do_sample: false
        n: 1
        temperature: 0
        top_k: -1
        top_p: 1.0
  algorithm:
    adv_estimator: grpo
    filter_groups:
      enable: false
      max_num_gen_batches: 0
      metric: null
    gamma: 1.0
    gigpo:
      enable_similarity: false
      mode: mean_norm
      similarity_thresh: 0.95
      step_advantage_w: 1.0
    hgpo:
      base_group: false
      length_weight_alpha: 1.0
      mode: mean_std_norm
      weight_type: length
    kl_ctrl:
      horizon: 10000
      kl_coef: 0.001
      target_kl: 0.1
      type: fixed
    kl_penalty: kl
    lam: 1.0
    norm_adv_by_std_in_grpo: true
    pf_ppo:
      reweight_method: pow
      weight_pow: 2.0
    use_kl_in_reward: false
    use_pf_ppo: false
  critic:
