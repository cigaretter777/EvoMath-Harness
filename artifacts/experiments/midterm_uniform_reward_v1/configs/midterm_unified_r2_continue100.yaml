schema_version: adaptive-math-grpo-v1
# Continuation of the frozen R2 arm from global_step_50 to global_step_100
# (2026-10-23). Only output/resume/save fields differ from
# midterm_unified_r2.yaml; reward, data, prompt, parser and tool budget are
# unchanged. Steps 1-50 were trained with the pre-fix verifier; steps 51-100
# use the fixed verifier:
#   src/adaptive_math/verifier/symbolic.py sha256
#   1de775613d9cb3fe8a9e0c91eacb59b239ac3609ee7c15265f2b579f83088fd7
# This is a performance exploration, not a pure step-count ablation.
task_pool_path: artifacts/task_pools/math_midterm_v1_rl_train.jsonl
task_pool_sha256: 635f9571b056f395fd574b9fd1e4d6e1eb4b28efbf3d38f38c410aed19396d46
budget_path: configs/agent/unified_tool_budget_v1.yaml
reward_path: configs/reward/r2_unified.yaml
output_dir: artifacts/experiments/midterm_uniform_reward_v1/training/r2_continue100
upstream_config_name: hgpo_trainer
upstream_overrides:
  - actor_rollout_ref.model.path=/root/autodl-tmp/Adaptive-Solver-main-git/artifacts/models/qwen3_1_7b_sft_tir_merged
  - actor_rollout_ref.model.enable_gradient_checkpointing=True
  - actor_rollout_ref.model.lora_rank=16
  - actor_rollout_ref.model.lora_alpha=32
  - actor_rollout_ref.rollout.n=1
  - actor_rollout_ref.rollout.tensor_model_parallel_size=1
  - actor_rollout_ref.rollout.temperature=1.0
  - actor_rollout_ref.rollout.top_p=0.95
  - actor_rollout_ref.rollout.top_k=20
